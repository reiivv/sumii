<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>sumii</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="sumii">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d0f14">
<meta name="referrer" content="no-referrer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@300&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f3f5;--fg:#0f1319;--mut:#6a727d;--card:#fff;--line:#dde1e6;--acc:#3b4cca;--accfg:#fff;color-scheme:light dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f14;--fg:#e9ecf1;--mut:#8b93a1;--card:#161a21;--line:#252a33;--acc:#8fa0ff;--accfg:#0d0f14}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;padding:0 env(safe-area-inset-right) 0 env(safe-area-inset-left)}
a{color:inherit}
small{color:var(--mut)}
h1{font-size:22px;font-weight:800;letter-spacing:-.03em}
.logo{font:300 36px/1 "Gaegu","Chalkboard SE","Comic Sans MS",cursive;letter-spacing:.01em}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;gap:12px;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,calc((100% - 960px)/2)) 10px;border-bottom:1px solid var(--line)}
.bar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rbar{position:static}
main{max-width:960px;margin:0 auto;padding:16px}
input{flex:1;min-width:0;font:inherit;font-size:16px;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button,.btn{font:inherit;padding:9px 14px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.sel,.pri{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.tabs{display:flex;gap:22px;max-width:960px;margin:0 auto;padding:12px 16px 0}
.tabs a{color:var(--mut);text-decoration:none;padding-bottom:8px;border-bottom:2px solid transparent;font-weight:600}
.tabs a.on{color:var(--fg);border-color:var(--acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:18px 14px}
.card{display:flex;flex-direction:column;gap:5px;text-decoration:none}
.card img{width:100%;aspect-ratio:2/3;object-fit:cover;border-radius:4px;background:var(--line)}
.card b{font-size:13px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hero{display:flex;gap:16px;margin-bottom:16px}
.hero img{width:110px;aspect-ratio:2/3;object-fit:cover;border-radius:4px;background:var(--line)}
.hero div{display:flex;flex-direction:column;gap:10px;align-items:flex-start;min-width:0}
.hero h1{font-size:20px;line-height:1.2}
.row{display:flex;gap:8px;flex-wrap:wrap}
.ch{display:flex;gap:12px;align-items:baseline;padding:11px 6px;border-bottom:1px solid var(--line);text-decoration:none}
.ch span{font-weight:700;min-width:70px;font-variant-numeric:tabular-nums}
.ch em{flex:1;font-style:normal;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.done{opacity:.4}
.ch.cur{background:color-mix(in srgb,var(--acc) 15%,transparent);border-radius:6px}
.pages{max-width:820px;margin:0 auto}
.pages img{display:block;width:100%;height:auto;min-height:240px;background:var(--card)}
.rfoot{max-width:820px;margin:0 auto;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 36px);text-align:center;display:grid;gap:14px}
.nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{padding:48px 16px;text-align:center;color:var(--mut)}
.foot{text-align:center;padding:24px 16px calc(env(safe-area-inset-bottom,0px) + 24px)}
</style>
</head>
<body>
<div id="app"></div>
<script>
// If the browser blocks MangaDex requests (CORS error), point this at your own
// free Cloudflare Worker proxy, e.g. 'https://manga-proxy.yourname.workers.dev'
const API = 'https://sumii-proxy.gabrielridleymoore.workers.dev';

const LS = 'mangaReader.v1', app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let lib = {}, saver = false, rt = 0;
try { lib = JSON.parse(localStorage.getItem(LS) || '{}'); saver = localStorage.getItem(LS + '.saver') === '1'; } catch {}
const save = () => { try { localStorage.setItem(LS, JSON.stringify(lib)); } catch {} };

async function api(path) {
  const r = await fetch(API + path);
  if (!r.ok) throw new Error('MangaDex returned ' + r.status);
  return r.json();
}
const mInfo = m => {
  const f = m.relationships.find(r => r.type === 'cover_art')?.attributes?.fileName;
  return { id: m.id, t: m.attributes.title.en || Object.values(m.attributes.title)[0] || 'Untitled',
           c: f ? `https://uploads.mangadex.org/covers/${m.id}/${f}.256.jpg` : '' };
};
const mcache = {}, ccache = {};
async function getManga(id) { return mcache[id] ||= mInfo((await api(`/manga/${id}?includes[]=cover_art`)).data); }
async function getChapters(id) {
  if (ccache[id]) return ccache[id];
  const all = []; let off = 0, total = 1;
  while (off < total) {
    const d = await api(`/manga/${id}/feed?translatedLanguage[]=en&order[chapter]=asc&limit=500&offset=${off}&includes[]=scanlation_group&contentRating[]=safe&contentRating[]=suggestive&contentRating[]=erotica`);
    all.push(...d.data); total = d.total; off += 500;
  }
  const seen = new Set(), out = [];
  for (const c of all) {
    const k = c.attributes.chapter ?? 'oneshot-' + c.id;
    if (c.attributes.pages > 0 && !c.attributes.externalUrl && !seen.has(k)) { seen.add(k); out.push(c); }
  }
  out.sort((a, b) => (parseFloat(a.attributes.chapter) || 0) - (parseFloat(b.attributes.chapter) || 0));
  return ccache[id] = out;
}
const lab = c => c.attributes.chapter ? 'Ch. ' + c.attributes.chapter : 'Oneshot';
const grp = c => c.relationships.filter(r => r.type === 'scanlation_group').map(r => r.attributes?.name).filter(Boolean).join(', ') || 'unknown group';
const card = (id, t, c, sub) => `<a class="card" href="#/m/${id}"><img loading="lazy" alt="" src="${esc(c)}"><b>${esc(t)}</b><small>${esc(sub)}</small></a>`;
const searchBar = (v = '', back = false) => `<header class="bar">${back ? '<a class="btn" href="#/">Library</a>' : '<h1 class="logo">sumii</h1>'}<input id="q" type="search" placeholder="Search MangaDex" enterkeyhint="search" value="${esc(v)}"></header>`;
const wireSearch = () => document.getElementById('q').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.value.trim()) location.hash = '#/s/' + encodeURIComponent(e.target.value.trim());
});
const credit = '<p class="foot"><small>Data and images from <a href="https://mangadex.org" target="_blank" rel="noopener">MangaDex</a>. Chapters are made by scanlation groups, who are credited in each chapter.</small></p>';

function home(tab) {
  const n = s => Object.values(lib).filter(v => v.s === s).length;
  const items = Object.entries(lib).filter(([, v]) => v.s === tab).sort((a, b) => (b[1].u || 0) - (a[1].u || 0));
  app.innerHTML = searchBar() +
    `<nav class="tabs"><a class="${tab === 'reading' ? 'on' : ''}" href="#/">Reading ${n('reading')}</a><a class="${tab === 'completed' ? 'on' : ''}" href="#/completed">Completed ${n('completed')}</a></nav>
     <main>${items.length ? `<div class="grid">${items.map(([id, v]) => card(id, v.t, v.c, v.n || '')).join('')}</div>`
       : `<p class="msg">${tab === 'reading' ? 'Nothing here yet. Search for a title to start reading.' : 'No completed titles yet.'}</p>`}</main>` + credit;
  wireSearch();
}

async function search(q, tok) {
  app.innerHTML = searchBar(q, true) + '<p class="msg">Searching…</p>'; wireSearch();
  const d = await api(`/manga?title=${encodeURIComponent(q)}&limit=24&includes[]=cover_art&order[relevance]=desc`);
  if (tok !== rt) return;
  const list = d.data.map(mInfo);
  list.forEach(m => mcache[m.id] = m);
  app.innerHTML = searchBar(q, true) + `<main>${list.length ? `<div class="grid">${list.map(m => card(m.id, m.t, m.c, lib[m.id]?.s === 'completed' ? 'Completed' : lib[m.id]?.n || '')).join('')}</div>` : '<p class="msg">No results. Try a different spelling.</p>'}</main>` + credit;
  wireSearch();
}

async function detail(id, tok) {
  app.innerHTML = searchBar('', true) + '<p class="msg">Loading chapters…</p>'; wireSearch();
  const [m, list] = await Promise.all([getManga(id), getChapters(id)]);
  if (tok !== rt) return;
  const e = lib[id], ci = e ? list.findIndex(c => c.id === e.ch) : -1;
  const go = list[ci >= 0 ? ci : 0];
  const st = (s, label) => `<button data-s="${s}" class="${e?.s === s ? 'sel' : ''}">${label}</button>`;
  app.innerHTML = searchBar('', true) + `<main>
    <div class="hero"><img alt="" src="${esc(m.c)}"><div><h1>${esc(m.t)}</h1>
      <div class="row">${st('reading', 'Reading')}${st('completed', 'Completed')}${e ? '<button data-s="">Remove</button>' : ''}</div>
      ${go ? `<a class="btn pri" href="#/r/${id}/${go.id}">${ci >= 0 ? 'Continue ' : 'Start '}${esc(lab(go))}</a>` : '<small>No English chapters available on MangaDex.</small>'}
    </div></div>
    ${list.map((c, i) => `<a class="ch ${ci >= 0 && i < ci ? 'done' : ''} ${i === ci ? 'cur' : ''}" href="#/r/${id}/${c.id}"><span>${esc(lab(c))}</span><em>${esc(c.attributes.title || '')}</em></a>`).join('')}</main>` + credit;
  wireSearch();
  app.querySelectorAll('[data-s]').forEach(b => b.onclick = () => {
    const s = b.dataset.s;
    if (!s) delete lib[id]; else lib[id] = { ...(lib[id] || { t: m.t, c: m.c }), s, u: Date.now() };
    save(); detail(id, tok);
  });
  app.querySelector('.cur')?.scrollIntoView({ block: 'center' });
}

async function reader(mid, cid, tok) {
  app.innerHTML = '<p class="msg">Loading chapter…</p>';
  const [m, list] = await Promise.all([getManga(mid), getChapters(mid)]);
  const i = list.findIndex(c => c.id === cid);
  if (i < 0) throw new Error('Chapter not found');
  const c = list[i];
  const e = lib[mid] ||= { t: m.t, c: m.c, s: 'reading' };
  e.ch = cid; e.n = lab(c); e.u = Date.now(); save();
  const d = await api('/at-home/server/' + cid);
  if (tok !== rt) return;
  const files = saver ? d.chapter.dataSaver : d.chapter.data, dir = saver ? 'data-saver' : 'data';
  const next = list[i + 1], prev = list[i - 1];
  app.innerHTML = `<header class="bar rbar"><a class="btn" href="#/m/${mid}">Back</a><span>${esc(m.t)}, ${esc(lab(c))}</span><button id="dq">${saver ? 'Data saver' : 'Full quality'}</button></header>
    <div class="pages">${files.map(f => `<img loading="lazy" alt="" src="${d.baseUrl}/${dir}/${d.chapter.hash}/${f}">`).join('')}</div>
    <footer class="rfoot"><div class="nav">${prev ? `<a class="btn" href="#/r/${mid}/${prev.id}">Previous</a>` : '<span></span>'}
      ${next ? `<a class="btn pri" href="#/r/${mid}/${next.id}">Next</a>` : '<button class="pri" id="fin">Finish and mark completed</button>'}</div>
      <small>Read on <a href="https://mangadex.org/chapter/${cid}" target="_blank" rel="noopener">MangaDex</a>. Scanlated by ${esc(grp(c))}.</small></footer>`;
  app.querySelectorAll('.pages img').forEach(im => im.onerror = () => {
    if (!im.dataset.r) { im.dataset.r = 1; setTimeout(() => im.src = im.src, 1200); }
  });
  document.getElementById('dq').onclick = () => {
    saver = !saver; try { localStorage.setItem(LS + '.saver', saver ? '1' : '0'); } catch {}
    reader(mid, cid, tok);
  };
  const fin = document.getElementById('fin');
  if (fin) fin.onclick = () => { lib[mid].s = 'completed'; lib[mid].u = Date.now(); save(); location.hash = '#/completed'; };
}

async function route() {
  const tok = ++rt, [, a, b, c] = location.hash.slice(1).split('/');
  window.scrollTo(0, 0);
  try {
    if (a === 'm' && b) await detail(b, tok);
    else if (a === 'r' && b && c) await reader(b, c, tok);
    else if (a === 's' && b) await search(decodeURIComponent(b), tok);
    else home(a === 'completed' ? 'completed' : 'reading');
  } catch (err) {
    if (tok !== rt) return;
    app.innerHTML = searchBar('', true) + `<p class="msg">Couldn’t load from MangaDex (${esc(err.message)}). Check your connection and reload. If it keeps failing on a site you host, the API may be blocking browser requests; see the note at the top of index.html.</p>`;
    wireSearch();
  }
}
addEventListener('hashchange', route);
route();
</script>
</body>
</html>
